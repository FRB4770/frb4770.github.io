<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="t d"><title id="t">King of Icefield reward tracks</title><desc id="d">Daily milestones, state rankings, and cross-state rankings each have distinct reward tracks.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#352044"/><stop offset="1" stop-color="#171322"/></linearGradient><linearGradient id="gold" x2="1"><stop stop-color="#946b31"/><stop offset=".5" stop-color="#f0d27e"/><stop offset="1" stop-color="#946b31"/></linearGradient></defs><rect width="760" height="420" rx="26" fill="url(#bg)"/><text x="380" y="54" text-anchor="middle" fill="#f1d17b" font-family="Arial,sans-serif" font-size="27" font-weight="700">THREE REWARD TRACKS</text><g font-family="Arial,sans-serif"><g transform="translate(35 93)"><rect width="215" height="250" rx="18" fill="#2a1d38" stroke="#6d567e" stroke-width="2"/><text x="107" y="42" text-anchor="middle" fill="#f6e8c6" font-size="19" font-weight="700">DAILY</text><text x="107" y="69" text-anchor="middle" fill="#cdbdd8" font-size="14">Milestones</text><g fill="url(#gold)"><rect x="32" y="103" width="151" height="24" rx="8"/><rect x="32" y="140" width="151" height="24" rx="8"/><rect x="32" y="177" width="151" height="24" rx="8"/><rect x="32" y="214" width="151" height="24" rx="8"/></g><g fill="#34243f" font-size="13" font-weight="700"><text x="107" y="120" text-anchor="middle">MILESTONE 1</text><text x="107" y="157" text-anchor="middle">MILESTONE 2</text><text x="107" y="194" text-anchor="middle">MILESTONE 3</text><text x="107" y="231" text-anchor="middle">MILESTONE 4</text></g></g><g transform="translate(272 93)"><rect width="215" height="250" rx="18" fill="#2a1d38" stroke="#6d567e" stroke-width="2"/><text x="107" y="42" text-anchor="middle" fill="#f6e8c6" font-size="19" font-weight="700">YOUR STATE</text><text x="107" y="69" text-anchor="middle" fill="#cdbdd8" font-size="14">Daily + total rank</text><path d="M56 204h103v-25h-78v-28h5